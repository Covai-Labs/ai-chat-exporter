<!doctype html>
<html lang="en">
  <head>
    <script defer src="https://covai.org/analytics.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <title>Sorry to see you go. - AI Chat Exporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background-color: #0b111e;
        font-family:
          'Outfit',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
      }
      .banner {
        flex: 0 0 auto;
        background: rgba(19, 30, 49, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 13.5px;
      }
      .banner-info {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .banner-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.25);
        color: #60a5fa;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .banner-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .banner-text span:first-child {
        color: #f8fafc;
        font-weight: 500;
      }
      .banner-subtext {
        color: #94a3b8;
        font-size: 12.5px;
      }
      .banner-subtext a {
        color: #60a5fa;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .banner-subtext a:hover {
        color: #93c5fd;
      }
      .github-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #f8fafc;
        text-decoration: none;
        font-weight: 500;
        padding: 7px 14px;
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.18);
        transition: all 0.2s ease;
        white-space: nowrap;
        font-size: 13px;
        flex-shrink: 0;
      }
      .github-link:hover {
        background: rgba(59, 130, 246, 0.18);
        border-color: rgba(59, 130, 246, 0.35);
        color: #60a5fa;
        transform: translateY(-1px);
      }
      .github-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .form-container {
        flex: 1;
        position: relative;
        width: 100%;
      }
      iframe {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        border: 0;
        width: 100%;
        height: 100%;
      }
      @media (max-width: 768px) {
        .banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
          padding: 12px 16px;
        }
        .banner-info {
          gap: 8px;
        }
        .github-link {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="banner-info">
        <div class="banner-badge">100% Local &amp; Open Source</div>
        <div class="banner-text">
          <span
            >AI Chat Exporter is fully local, free, and open source. All contributions and feedback
            are warmly welcomed!</span
          >
          <span class="banner-subtext"
            >You can directly fix issues or contribute on
            <a
              href="https://github.com/Covai-Labs/ai-chat-exporter"
              target="_blank"
              rel="noopener noreferrer"
              >GitHub</a
            >, or submit your thoughts below and I will surely look into them.</span
          >
        </div>
      </div>
      <a
        href="https://github.com/Covai-Labs/ai-chat-exporter"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"
      >
        <svg class="github-icon" viewBox="0 0 24 24">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
        <span>Contribute on GitHub</span>
      </a>
    </div>
    <div class="form-container">
      <iframe
        id="tally-uninstall-iframe"
        data-tally-src="https://tally.so/r/D4EQlj?transparentBackground=1&formEventsForwarding=1"
        width="100%"
        height="100%"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Sorry to see you go."
      ></iframe>
    </div>
    <script>
      (function () {
        const iframe = document.getElementById('tally-uninstall-iframe');
        if (!iframe) return;

        const ua = navigator.userAgent || '';
        let browser = 'Unknown';
        if (ua.includes('Edg/')) browser = 'Edge';
        else if (ua.includes('OPR/') || ua.includes('Opera/')) browser = 'Opera';
        else if (ua.includes('Firefox/') || ua.includes('FxiOS/')) browser = 'Firefox';
        else if (ua.includes('Chrome/') || ua.includes('CriOS/')) browser = 'Chrome';
        else if (ua.includes('Safari/') && !ua.includes('Chrome/')) browser = 'Safari';

        let os = 'Unknown';
        if (ua.includes('Win')) os = 'Windows';
        else if (ua.includes('Mac')) os = 'macOS';
        else if (ua.includes('Android')) os = 'Android';
        else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes('iPod')) os = 'iOS';
        else if (ua.includes('CrOS')) os = 'ChromeOS';
        else if (ua.includes('Linux') || ua.includes('X11')) os = 'Linux';

        const params = new URLSearchParams(window.location.search);
        if (!params.has('user_agent')) params.set('user_agent', ua);
        if (!params.has('browser')) params.set('browser', browser);
        if (!params.has('os')) params.set('os', os);
        if (!params.has('language') && navigator.language)
          params.set('language', navigator.language);
        if (!params.has('screen') && window.screen)
          params.set('screen', `${window.screen.width}x${window.screen.height}`);
        if (!params.has('timezone')) {
          try {
            params.set('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone || '');
          } catch (e) {}
        }

        const currentSrc = iframe.getAttribute('data-tally-src');
        const separator = currentSrc.includes('?') ? '&' : '?';
        iframe.setAttribute('data-tally-src', currentSrc + separator + params.toString());
        if (window.Tally && typeof window.Tally.loadEmbeds === 'function') {
          window.Tally.loadEmbeds();
        }
      })();
    </script>
  </body>
</html>
