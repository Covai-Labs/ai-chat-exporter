  <style>
    /* Neo-Brutalist Tactile Cards */
    .tactile-card {
      border: 2px solid #1e293b;
      box-shadow: 4px 4px 0px 0px #0f172a;
      transition: all 0.15s ease-in-out;
    }

    .dark .tactile-card {
      border-color: #334155;
      box-shadow: 4px 4px 0px 0px #1e293b;
    }

    .tactile-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px 0px #38bdf8;
      border-color: #38bdf8;
    }

    .ghost-glow {
      animation: floatGlow 4s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% {
        transform: translateY(0px);
        filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.2));
      }
      100% {
        transform: translateY(-8px);
        filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.4));
      }
    }
  </style>
