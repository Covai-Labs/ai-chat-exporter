<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-row">
          <div id="status" class="status">Detecting...</div>
          <div class="header-actions">
            <button id="open-options-btn" class="sidepanel-icon-btn" title="Open Options">
              ⚙️
            </button>
            <button id="open-sidepanel-btn" class="sidepanel-icon-btn" title="Open Side Panel">
              ↗ Side Panel
            </button>
          </div>
        </div>
      </header>

      <main>
        <div class="chat-info hidden" id="chat-info">
          <h2 id="chat-title">Chat Title</h2>
          <p id="message-count">0 messages found</p>
        </div>

        <div class="actions hidden" id="actions">
          <div class="field-group">
            <label for="filename-input" class="field-label">Filename</label>
            <input
              type="text"
              id="filename-input"
              class="text-input"
              placeholder="filename_without_extension"
            />
          </div>
          <select id="format-select">
            <option value="markdown">Markdown (.md)</option>
            <option value="json">JSON (.json)</option>
            <option value="html">HTML (.html)</option>
            <option value="doc">Word Document (.doc)</option>
            <option value="png">Shareable Image (.png)</option>
            <option value="pdf">PDF (.pdf)</option>
          </select>
          <div id="png-warning-banner" class="png-warning-banner hidden">
            ⚠️ PNG export on long chats may take 1–2 minutes. Consider PDF or Markdown for instant
            export.
          </div>
          <div class="checkbox-wrapper" id="image-toggle-container">
            <label class="checkbox-label">
              <input type="checkbox" id="include-images-checkbox" checked />
              Include Images
            </label>
          </div>
          <div class="checkbox-wrapper hidden" id="png-quality-container">
            <label class="checkbox-label">
              <input type="checkbox" id="png-quality-checkbox" checked />
              High Quality PNG (2x)
            </label>
          </div>
          <div class="button-group">
            <div class="primary-row">
              <button id="export-btn" class="primary-btn">Export Chat</button>
            </div>
            <div class="secondary-row">
              <button id="copy-btn" class="secondary-btn hidden">Copy to Clipboard</button>
              <button id="preview-btn" class="secondary-btn hidden">Open in Tab</button>
            </div>
          </div>

          <div class="transfer-section" id="transfer-section">
            <div class="divider"><span>Or Transfer Chat</span></div>
            <div class="field-group">
              <label for="continue-target-select" class="field-label">Continue On</label>
              <div class="transfer-row">
                <select id="continue-target-select">
                  <option value="chatgpt">ChatGPT</option>
                  <option value="claude">Claude</option>
                  <option value="gemini">Gemini</option>
                  <option value="deepseek">DeepSeek</option>
                  <option value="qwen">Qwen</option>
                  <option value="perplexity">Perplexity</option>
                  <option value="mistral">Mistral</option>
                  <option value="notebooklm">NotebookLM</option>
                </select>
                <button id="transfer-btn" class="transfer-btn">↗ Continue</button>
              </div>
            </div>
          </div>
        </div>

        <div class="error hidden" id="error-msg">No compatible chat found on this tab.</div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
