<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Chat Exporter</h1>
        <div id="status" class="status">Detecting...</div>
      </header>

      <main>
        <div class="chat-info hidden" id="chat-info">
          <h2 id="chat-title">Chat Title</h2>
          <p id="message-count">0 messages found</p>
        </div>

        <div class="actions hidden" id="actions">
          <select id="format-select">
            <option value="markdown">Markdown (.md)</option>
            <option value="json">JSON (.json)</option>
            <option value="html">HTML (.html)</option>
            <!-- <option value="pdf">PDF (.pdf)</option> -->
          </select>
          <div class="checkbox-wrapper" id="image-toggle-container">
            <label class="checkbox-label">
              <input type="checkbox" id="include-images-checkbox" checked />
              Include Images
            </label>
          </div>
          <div class="button-group">
            <div class="primary-row">
              <button id="export-btn" class="primary-btn">Export Chat</button>
            </div>
            <div class="secondary-row">
              <button id="copy-btn" class="secondary-btn hidden">Copy to Clipboard</button>
              <button id="preview-btn" class="secondary-btn hidden">Open in Tab</button>
            </div>
          </div>
        </div>

        <div class="error hidden" id="error-msg">No compatible chat found on this tab.</div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
